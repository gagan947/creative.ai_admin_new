<section class="feature-page">
  <div class="toolbar">
    <div class="title-brand">
      <h2>Errors & Failures</h2>
    </div>

    <div class="toolbar-controls">
      <div class="search-box">
        <input placeholder="Search errors" />
      </div>

      <div class="filter-controls">
        <label class="filter-item">
          <span>From</span>
          <input type="date" />
        </label>
        <label class="filter-item">
          <span>To</span>
          <input type="date" />
        </label>
        <label class="filter-item">
          <span>Error Type</span>
          <select>
            <option>All</option>
            <option>Build</option>
            <option>Deploy</option>
            <option>Payment</option>
            <option>API</option>
          </select>
        </label>
        <label class="filter-item">
          <span>Severity</span>
          <select>
            <option>All</option>
            <option>Critical</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <app-ui-button label="Export CSV" variant="secondary"></app-ui-button>
      </div>
    </div>
  </div>

  <section class="table-section">
    <app-ui-table [columns]="columns" [rows]="rows"></app-ui-table>
  </section>
</section>
